name: Repair case study pages
on:
  push:
    paths:
      - '.github/workflows/repair-case-study-pages.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Standardize landing pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text();
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1))

          # TropiBite: keep the brief clean and remove unnecessary metadata/product chips.
          p=Path('tropibite.html'); s=p.read_text()
          s=re.sub(r'<div><p><strong>Positioning:</strong>.*?</div></div></div></section>', '</div></div></div></section>', s, count=1, flags=re.S)
          s=s.replace('.stat{padding:28px clamp(18px,3vw,34px);border-right:1px solid var(--line)}', '.stat{padding:28px clamp(18px,3vw,34px);border-right:1px solid var(--line);background:rgba(31,138,92,.07)}', 1)
          p.write_text(s)

          # Greywith: match the same tinted stat-box treatment.
          p=Path('greywithsign.html'); s=p.read_text()
          s=s.replace('.stat{border:1px solid var(--line);padding:24px;text-align:center;background:var(--paper)}', '.stat{border:1px solid var(--line);padding:24px;text-align:center;background:rgba(176,140,46,.07)}', 1)
          p.write_text(s)

          # Upwork: same opening hierarchy and naming as the other case studies.
          p=Path('upwork.html'); s=p.read_text()
          s=s.replace('.stat{border:1px solid var(--line);padding:24px;text-align:center}', '.stat{border:1px solid var(--line);padding:24px;text-align:center;background:rgba(20,168,0,.07)}', 1)
          s=s.replace('<div class="head"><h2>What I’ve Done</h2></div>', '<div class="head"><h2>What I Worked On</h2></div>', 1)
          marker='<div class="head"><h2>What I Worked On</h2></div>'
          brief='<div class="head"><h2>The Brief</h2></div><p class="story">Upwork has been a flexible freelance lane alongside my creative work, where I have taken on AI data annotation, video editing, proofreading and translation projects.</p>'
          s=s.replace(marker, brief+marker, 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tropibite.html greywithsign.html upwork.html
          git diff --cached --quiet || git commit -m 'Standardize case study landing page openings'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/repair-case-study-pages.yml
          git commit -m 'Remove temporary repair workflow'
          git push
