name: Standardize portfolio case studies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  standardize:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-standardize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Standardize portfolio pages
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              'index.html','casestody.html','greysole.html','buzzandbloom.html',
              'tropibite.html','greywithsign.html','harmatan.html','upwork.html'
          ]
          case_pages = [
              'casestody.html','greysole.html','buzzandbloom.html',
              'tropibite.html','greywithsign.html','upwork.html'
          ]

          # Poppins is the portfolio-wide type system.
          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'https://fonts\.googleapis\.com/css2\?family=[^\"\']+',
                         'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap', s)
              s = s.replace("font-family:'Anton'", "font-family:'Poppins'")
              s = s.replace('font-family:"Anton"', 'font-family:"Poppins"')
              s = s.replace("font-family:Anton", "font-family:Poppins")
              s = s.replace("font-family:'Archivo'", "font-family:'Poppins'")
              s = s.replace('font-family:"Archivo"', 'font-family:"Poppins"')
              s = s.replace("font-family:Archivo", "font-family:Poppins")
              s = s.replace("font-family:'Space Mono'", "font-family:'Poppins'")
              s = s.replace('font-family:"Space Mono"', 'font-family:"Poppins"')
              s = s.replace("font-family:Space Mono", "font-family:Poppins")
              # Normalize common heading/body weights without changing layout.
              s = re.sub(r'(h1,h2,h3\{[^}]*?font-weight:)400', r'\g<1>800', s)
              s = re.sub(r'(body\{[^}]*?font-family:[^;]+;[^}]*?)(font-size:)', r'\g<1>font-weight:400;\2', s)

              # Remove decorative section/brand numbering, not actual stats.
              s = re.sub(r'\b(?:CS|GS|BB|TB|GW|UP)\.\d{2}\b', '', s, flags=re.I)
              s = re.sub(r'<(?:span|div|p)[^>]*class=[\"\'][^\"\']*(?:eyebrow|section-num|section-number|d-num|code)[^\"\']*[\"\'][^>]*>\s*(?:0[1-9]|1[0-9])\s*(?:[/·-]\s*(?:0?[1-9]|1[0-9]))?\s*</(?:span|div|p)>', '', s, flags=re.I)
              p.write_text(s, encoding='utf-8')

          # Canonical case-study work-grid naming. Target only the four stub/legacy pages;
          # Casestody and Greysole are already the reference structure.
          for name in ['buzzandbloom.html','tropibite.html','greywithsign.html','upwork.html']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\.grid\b', '.work-grid', s)
              s = re.sub(r'\.card\b', '.work-item', s)
              s = re.sub(r'\bgrid\b', 'work-grid', s) if False else s
              s = re.sub(r'class=([\"\'])grid\1', r'class=\1work-grid\1', s)
              s = re.sub(r'class=([\"\'])card\1', r'class=\1work-item\1', s)
              p.write_text(s, encoding='utf-8')

          animation_css = r'''
          <style id="portfolio-polish">
          .work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
          .work-item{transition:transform .45s ease,box-shadow .45s ease,opacity .6s ease}
          .work-item:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 14px 30px rgba(20,18,16,.12)}
          .work-grid .work-item{opacity:0;transform:translateY(18px)}
          .work-grid .work-item.polished-in{opacity:1;transform:none}
          .gallery-item{overflow:hidden;cursor:pointer;transition:transform .45s ease,box-shadow .45s ease}
          .gallery-item:hover{transform:scale(1.02);box-shadow:0 14px 30px rgba(20,18,16,.12)}
          a{transition:opacity .3s ease,color .3s ease}
          a:hover{opacity:.9}
          a:not(.nav):not(.back):not(.mark):not(.cta){text-decoration-thickness:1px;text-underline-offset:4px}
          .hero{background-position:center calc(50% + var(--hero-shift,0px));will-change:background-position}
          @media(max-width:760px){.work-grid{grid-template-columns:1fr}}
          @media(prefers-reduced-motion:reduce){.work-item,.gallery-item{transition:none!important}.work-grid .work-item{opacity:1!important;transform:none!important}}
          </style>
          '''
          animation_js = r'''
          <script id="portfolio-polish-script">
          (()=>{
            const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const grids=document.querySelectorAll('.work-grid');
            grids.forEach(grid=>grid.querySelectorAll('.work-item').forEach((item,i)=>{
              item.style.transitionDelay=reduce?'0ms':`${i*100}ms`;
            }));
            const revealItems=document.querySelectorAll('.work-grid .work-item');
            if(!reduce&&'IntersectionObserver' in window){
              const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('polished-in');io.unobserve(e.target)}}),{threshold:.08});
              revealItems.forEach(e=>io.observe(e));
            }else revealItems.forEach(e=>e.classList.add('polished-in'));

            const stats=document.querySelectorAll('.stat .num,.stat strong');
            const parse=(text)=>{const m=text.trim().match(/^([^0-9]*)([0-9][0-9,.]*)(.*)$/);if(!m)return null;return {pre:m[1],num:parseFloat(m[2].replace(/,/g,'')),suffix:m[3],dec:(m[2].includes('.')?m[2].split('.')[1].length:0),comma:m[2].includes(',')}};
            const animateStat=(el)=>{if(el.dataset.counted)return;const x=parse(el.textContent);if(!x)return;el.dataset.counted='1';const start=performance.now(),dur=1500;const tick=t=>{const p=Math.min((t-start)/dur,1),e=1-Math.pow(1-p,3),v=x.num*e;let out=x.dec?v.toFixed(x.dec):Math.round(v).toLocaleString();if(x.comma&&x.dec===0)out=Math.round(v).toLocaleString();el.textContent=x.pre+out+x.suffix;if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)};
            if(!reduce&&'IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){animateStat(e.target);io.unobserve(e.target)}}),{threshold:.5});stats.forEach(s=>io.observe(s))}else stats.forEach(s=>{s.dataset.counted='1'});

            const hero=document.querySelector('.hero');
            if(hero&&!reduce){let ticking=false;const update=()=>{hero.style.setProperty('--hero-shift',`${Math.min(window.scrollY*.035,18)}px`);ticking=false};window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(update);ticking=true}},{passive:true});}
          })();
          </script>
          '''
          for name in pages:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if 'id="portfolio-polish"' not in s:
                  s=s.replace('</head>', animation_css+'\n</head>',1)
              if 'id="portfolio-polish-script"' not in s:
                  s=s.replace('</body>', animation_js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          files=['index.html','casestody.html','greysole.html','buzzandbloom.html','tropibite.html','greywithsign.html','harmatan.html','upwork.html']
          for f in files:
              s=Path(f).read_text(encoding='utf-8')
              assert 'Poppins' in s, f'Poppins missing: {f}'
              assert 'portfolio-polish' in s, f'polish missing: {f}'
          for f in ['buzzandbloom.html','tropibite.html','greywithsign.html','upwork.html']:
              s=Path(f).read_text(encoding='utf-8')
              assert 'work-grid' in s and 'work-item' in s, f'case-study structure missing: {f}'
          PY
          git diff --check
          git config user.name 'portfolio-standardize[bot]'
          git config user.email 'portfolio-standardize[bot]@users.noreply.github.com'
          git add index.html casestody.html greysole.html buzzandbloom.html tropibite.html greywithsign.html harmatan.html upwork.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Standardize portfolio case studies and interactions [portfolio-standardize]'
          git push
